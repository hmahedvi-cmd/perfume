<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>perfume-react</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener("error", (event) => {
        const rootEl = document.getElementById("root");
        if (rootEl) {
          rootEl.innerHTML = `
            <div style="padding: 20px; color: red; background: #fee; border: 1px solid red; border-radius: 8px; margin: 20px; text-align: left; font-family: monospace; z-index: 9999; position: relative;">
              <h3>Runtime Error detected:</h3>
              <p>${event.message}</p>
              <p>in ${event.filename}:${event.lineno}:${event.colno}</p>
              <pre>${event.error ? event.error.stack : ""}</pre>
            </div>
          `;
        }
      });
      window.addEventListener("unhandledrejection", (event) => {
        const rootEl = document.getElementById("root");
        if (rootEl) {
          rootEl.innerHTML = `
            <div style="padding: 20px; color: red; background: #fee; border: 1px solid red; border-radius: 8px; margin: 20px; text-align: left; font-family: monospace; z-index: 9999; position: relative;">
              <h3>Unhandled Promise Rejection:</h3>
              <p>${event.reason}</p>
            </div>
          `;
        }
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
